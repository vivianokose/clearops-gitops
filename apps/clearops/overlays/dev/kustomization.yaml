# ClearOps, dev environment. Only the differences from base live here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base
- feature-flags.yaml
patches:
- path: patch-configmap.yaml
- path: patch-hpa.yaml
replicas:
- count: 1
  name: clearops-frontend
# Jenkins changes these tags with "kustomize edit set image" (Concept 12).
images:
- name: crystalvivian/clearops-api
  newTag: 1.0.1
- name: crystalvivian/clearops-frontend
  newTag: 1.0.0
