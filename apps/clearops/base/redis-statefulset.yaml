apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-store
  annotations:
    argocd.argoproj.io/sync-wave: "0"    # data layer first (its Secret is wave -1)
spec:
  serviceName: redis-store
  replicas: 1
  selector:
    matchLabels:
      app: redis-store
  template:
    metadata:
      labels:
        app: redis-store
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Lab 10: require a password. $(REDIS_PASSWORD) is filled in by Kubernetes
          # from the env var below, which comes from the redis-auth Secret.
          # That Secret is created in-cluster by the Sealed Secrets controller,
          # from the encrypted SealedSecret committed in each overlay.
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-store
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None   # headless: gives the StatefulSet pod a stable DNS name
  selector:
    app: redis-store
  ports:
    - port: 6379
