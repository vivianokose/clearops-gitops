# ClusterIP, not NodePort. Dev and staging both run on one cluster, and two
# NodePort 30080s would clash. Reach it with kubectl port-forward instead.
apiVersion: v1
kind: Service
metadata:
  name: clearops-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: clearops-frontend
  ports:
    - port: 80
      targetPort: 80
