apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clearops-api-hpa
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clearops-api
  minReplicas: 2        # overlays adjust these
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
