# ClearOps in the dev namespace (Concept 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clearops-dev
  namespace: argocd          # the Application object lives here...
spec:
  project: clearops          # ...guarded by the AppProject
  source:
    repoURL: https://github.com/vivianokose/clearops-gitops
    targetRevision: main     # follow every new commit on main
    path: apps/clearops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev           # ...and the app it deploys lands here
  syncPolicy:
    # Lab 04 Step 3: automated + selfHeal. Reacts to new commits AND to drift.
    # Each switch is written out on its own, so it is obvious they are
    # separate settings (Concept 8).
    automated:
      selfHeal: true         # Lab 04 Step 3: undo manual changes in the cluster
      prune: false           # does NOT delete things removed from git (Lab 05)
    syncOptions:
      - CreateNamespace=true
    # If a wave is not healthy yet (like the HPA with no metrics on a fresh pod),
    # try the sync again instead of giving up: 15s, 30s, 60s, 2m, 3m.
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
